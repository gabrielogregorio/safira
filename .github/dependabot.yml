version: 2
updates:
  - package-ecosystem: 'github-actions'
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 3
    labels: ['ci', 'dependencies']
    commit-message:
      prefix: 'Bump'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 3
    labels: ['dependencies']
    commit-message:
      prefix: 'Bump'
    ignore:
      # TypeScript 7 is the Go compiler, without the JS API typescript-eslint needs
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # follows the Node version in .nvmrc
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

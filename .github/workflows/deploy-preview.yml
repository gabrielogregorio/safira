name: preview deploy

on:
  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Publish the app of this branch
    # forks and Dependabot get a read-only token, so they cannot publish
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    environment:
      name: preview
      url: ${{ steps.name.outputs.url }}
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    env:
      HEAD_REF: ${{ github.head_ref }}
      OWNER: ${{ github.repository_owner }}
      REPOSITORY: ${{ github.event.repository.name }}
    steps:
      # The build runs third party code: only the publish step may see the token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment

      - name: Name the preview after the branch
        id: name
        run: |
          BRANCH_NAME="${HEAD_REF##*/}"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"
          echo "url=https://$OWNER.github.io/$REPOSITORY/preview/$BRANCH_NAME/" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: pnpm run build

      - uses: ./.github/actions/publish-pages
        with:
          directory: build
          destination: preview/${{ env.BRANCH_NAME }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Link the preview on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const branch = process.env.BRANCH_NAME;
            const base = `https://${owner}.github.io/${repo}`;
            const body = [
              '### Preview',
              `- App: ${base}/preview/${branch}/`,
              '',
              'GitHub Pages can take a minute to publish after this comment.',
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const previous = comments.find((c) => c.user.type === 'Bot' && c.body.startsWith('### Preview'));
            if (previous) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: Tests Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (coverage gate)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment

      - name: Run unit tests with coverage thresholds
        run: pnpm run unit:coverage

      - name: Run every command combination in each language
        run: pnpm run unit:matrix

  e2e:
    name: E2E Tests (Playwright, axe and memory)
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-environment
        with:
          e2e: 'true'

      - name: Build for production
        run: pnpm run build

      - name: Run the production build against the E2E suite
        run: pnpm run e2e

      - name: Measure memory and CPU in real use
        run: |
          pnpm run preview --host 127.0.0.1 &
          until curl -sf http://127.0.0.1:5556/ > /dev/null; do sleep 1; done
          pnpm run e2e:resources

      - name: Upload the failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            resourceUsageReport.json
          if-no-files-found: ignore
          retention-days: 14

name: Tests Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests (coverage gate)
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-environment

      - name: Run unit tests with coverage thresholds
        run: pnpm run unit:coverage

  e2e:
    name: E2E Tests (Playwright, axe and memory)
    needs: unit
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: ./.github/actions/setup-environment
        with:
          e2e: 'true'

      - name: Build for production
        run: pnpm run build

      - name: Run the production build against the E2E suite
        run: pnpm run e2e

      - name: Measure memory and CPU in real use
        run: |
          pnpm run preview --host 127.0.0.1 &
          until curl -sf http://127.0.0.1:5556/ > /dev/null; do sleep 1; done
          pnpm run e2e:resources

      - name: Upload the failure report
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: e2e-report
          path: |
            playwright-report
            test-results
            resourceUsageReport.json
          if-no-files-found: ignore
          retention-days: 14

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Safira, a programming language in natural language, with a web IDE" />
    <link rel="icon" type="image/png" href="./icone.png" />
    <title>Safira</title>
    <style>
      /* The sky of the saved theme from the first paint, so a reload never flashes white while the app loads. */
      html {
        min-height: 100%;
        background: linear-gradient(180deg, #2f9fe8 0%, #7fd1f7 42%, #d6f4ff 72%, #eefcff 100%) fixed #7fd1f7;
      }

      html[data-theme='dark'] {
        background: linear-gradient(180deg, #04142f 0%, #082f5c 48%, #0a5a6a 82%, #0f8a6d 100%) fixed #082f5c;
      }

      html[data-theme='simple'] {
        background: linear-gradient(180deg, #05505c 0%, #087f86 50%, #16b39a 86%, #5fdc9f 100%) fixed #087f86;
      }

      html[data-theme='dark'] .seo-intro,
      html[data-theme='simple'] .seo-intro {
        color: #eaf6ff;
      }

      html.snap-return {
        background: #000000;
      }

      /* What Safira is, for search engines and while the app loads. */
      .seo-intro {
        max-width: 640px;
        margin: 15vh auto 0;
        padding: 0 16px;
        color: #12395c;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
        text-align: center;
      }

      .seo-intro h1 {
        font-size: 1.6rem;
      }

      .seo-intro a {
        color: inherit;
      }
    </style>
    <script>
      // The same key as src/settings/storageKey.ts and settings.ts: each preview keeps its own settings.
      try {
        var preview = /\/preview\/([^/]+)\//.exec(location.pathname);
        var prefix = preview === null ? 'safira.' : 'safira-preview.' + preview[1] + '.';
        var theme = JSON.parse(localStorage.getItem(prefix + 'settings.v1') || '{}').theme;

        if (theme === 'light' || theme === 'dark' || theme === 'simple') {
          document.documentElement.dataset.theme = theme;
        }
      } catch {
        // Without storage the page starts in the light sky.
      }
    </script>
    <script>
      try {
        if (sessionStorage.getItem('safira.snap.return') !== null) {
          sessionStorage.removeItem('safira.snap.return');
          document.documentElement.classList.add('snap-return', 'snap-running');
          // 2 s of black, then 4 s into the fade in.
          setTimeout(function () {
            document.documentElement.classList.remove('snap-running');
          }, 6000);
        }
      } catch {
        // Without storage the page only skips the fade in.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

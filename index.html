<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Safira, a programming language in natural language, with a web IDE" />
    <link rel="icon" type="image/png" href="./icone.png" />
    <title>Safira</title>
    <style>
      html.snap-return {
        background: #000000;
      }
    </style>
    <script>
      try {
        if (sessionStorage.getItem('safira.snap.return') !== null) {
          sessionStorage.removeItem('safira.snap.return');
          document.documentElement.classList.add('snap-return');
        }
      } catch {
        // Without storage the page only skips the fade in.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
